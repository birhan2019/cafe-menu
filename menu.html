<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የካፌ ሜኑ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 15px;
            direction: ltr;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .menu-item {
            background: #fff;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h3 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .item-info p {
            margin: 0;
            color: #7f8c8d;
            font-size: 14px;
        }
        .price {
            font-weight: bold;
            color: #e74c3c;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>☕️ የካፌ ሜኑ </h1>

    <div class="menu-item">
        <div class="item-info">
            <h3>ልዩ ማኪያቶ (Special Macchiato)</h3>
            <p>በጥራት የተጠበሰ ቡና እና ትኩስ ወተት</p>
        </div>
        <div class="price">45 ብር</div>
    </div>

    <div class="menu-item">
        <div class="item-info">
            <h3>ባህላዊ ቡና (Traditional Coffee)</h3>
            <p>ከዕጣን ጋር የሚቀርብ የሀገር ባህል ቡና</p>
        </div>
        <div class="price">30 ብር</div>
    </div>

    <div class="menu-item">
        <div class="item-info">
            <h3>የፍራፍሬ ጭማቂ (Mix Juice)</h3>
            <p>አቮካዶ፣ ማንጎ እና ፓፓያ የተደባለቀበት</p>
        </div>
        <div class="price">120 ብር</div>
    </div>

</body>
</html>
